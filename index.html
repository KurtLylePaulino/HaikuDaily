<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>俳句 · Haiku Daily</title>
  <meta name="description" content="A philosophical haiku from the classical Japanese masters each day — Bashō, Issa, Buson and others. A living sumi-e night scene; reroll, copy, and let the koto play." />
  <meta name="theme-color" content="#0d1326" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600;700&family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===================== LIVING BACKGROUND SCENE ===================== -->
  <div class="scene" aria-hidden="true">
    <div class="sky"></div>
    <div class="stars"></div>
    <div class="moon"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="cloud cloud-4"></div>
    <div class="cloud cloud-5"></div>

    <!-- parallax mountain layers -->
    <svg class="range range-far" viewBox="0 0 1440 320" preserveAspectRatio="xMidYMax slice">
      <path d="M0,320 L0,232 C150,200 300,196 470,214 C640,232 740,262 900,248 C1060,234 1210,196 1440,224 L1440,320 Z"/>
    </svg>
    <svg class="range range-mid" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMax slice">
      <defs>
        <linearGradient id="fujiGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#33406a"/>
          <stop offset="0.5" stop-color="#202a4d"/>
          <stop offset="1" stop-color="#121833"/>
        </linearGradient>
      </defs>
      <!-- Mt Fuji: wide concave slopes, flattened crater rim -->
      <path class="fuji-body" d="M0,420 L0,372 L360,372 C470,372 520,320 640,176 C690,116 706,70 720,66 C734,70 750,116 800,176 C920,320 970,372 1080,372 L1440,372 L1440,420 Z"/>
      <!-- snow cap with the classic jagged lower edge -->
      <path class="fuji-snow" d="M654,182 C690,150 704,112 720,66 C736,112 750,150 786,182 L775,190 L763,180 L751,192 L739,181 L727,193 L716,181 L704,192 L692,180 L680,191 L667,180 Z"/>
    </svg>
    <svg class="range range-near" viewBox="0 0 1440 240" preserveAspectRatio="xMidYMax slice">
      <path d="M0,240 L0,150 C120,120 220,160 360,150 C520,138 600,90 760,120 C900,146 1010,180 1180,150 C1300,128 1380,150 1440,140 L1440,240 Z"/>
    </svg>

    <div class="mist"></div>

    <!-- particle canvas: floating sky-lanterns, fireflies + sakura petals -->
    <canvas class="particles" id="particles"></canvas>
  </div>

  <!-- ===================== INTRO: SHOJI SCREENS ===================== -->
  <div class="intro" id="intro">
    <div class="shoji shoji-left"></div>
    <div class="shoji shoji-right"></div>
  </div>

  <!-- vertical brand strip -->
  <div class="vbrand" aria-hidden="true">日々の俳句</div>

  <!-- ===================== MAIN CARD ===================== -->
  <main class="scroll" id="scroll">
    <div class="seal" id="seal" title="Haiku Daily" aria-hidden="true"><span>俳</span></div>

    <header class="masthead">
      <span class="brand-jp" id="brandJp">俳句</span>
      <span class="brand-en">Haiku Daily</span>
    </header>

    <p class="date" id="dateLabel"></p>

    <section class="haiku-block" id="haikuBlock">
      <span class="theme-kanji" id="themeKanji" aria-hidden="true">静</span>
      <blockquote class="haiku" id="haiku" aria-live="polite">
        <span class="line">The old pond—</span>
        <span class="line">a frog leaps in:</span>
        <span class="line">the sound of water</span>
      </blockquote>
      <span class="ink-sweep" id="inkSweep" aria-hidden="true"></span>
      <p class="jp" id="jp" lang="ja">古池や蛙飛び込む水の音</p>
      <p class="byline" id="byline">— Matsuo Bashō · 1644–1694</p>
      <p class="theme-label" id="themeLabel">stillness · the eternal now</p>
    </section>

    <div class="controls">
      <button id="rerollBtn" class="btn btn-primary" type="button">
        <span class="ico" aria-hidden="true">⟳</span><span class="lbl">Reroll</span>
      </button>
      <button id="copyBtn" class="btn btn-ghost" type="button">
        <span class="ico" aria-hidden="true">⧉</span><span class="lbl">Copy</span>
      </button>
      <button id="musicBtn" class="btn btn-ghost" type="button" aria-pressed="false" title="Background music">
        <span class="ico" aria-hidden="true">♪</span><span class="lbl">Music off</span>
      </button>
      <label class="vol" id="volWrap" title="Music volume">
        <span class="ico" aria-hidden="true">🔊</span>
        <input id="volSlider" type="range" min="0" max="100" value="40"
               aria-label="Music volume" />
        <span class="vol-val" id="volVal">40%</span>
      </label>
      <button id="sfxBtn" class="btn btn-ghost" type="button" aria-pressed="true" title="UI sound effects">
        <span class="ico" aria-hidden="true">🔔</span><span class="lbl">Sound on</span>
      </button>
    </div>

    <footer class="foot">
      <span id="poolCount"></span>
      <span class="hint">press <kbd>R</kbd> to reroll · <kbd>C</kbd> to copy</span>
    </footer>

    <div class="seigaiha" aria-hidden="true"></div>
  </main>

  <div class="ripples" id="ripples" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="haikus.js"></script>
  <script src="app.js"></script>
</body>
</html>
